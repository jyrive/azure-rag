name: Deploy Azure RAG

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      AZURE_RESOURCE_GROUP: rg-azure-rag-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      DEPLOYMENT_NAME: azure-rag-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      REGISTRY_DEPLOYMENT_NAME: azure-rag-registry-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy registry + identity
        id: registry
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            cancel_active_deployment() {
              local dep_name="$1"
              local state

              state=$(az deployment group show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$dep_name" \
                --query properties.provisioningState \
                -o tsv 2>/dev/null || echo "NotFound")

              if [ "$state" = "Accepted" ] || [ "$state" = "Running" ]; then
                echo "Deployment $dep_name is active ($state). Canceling to avoid DeploymentActive conflicts..."
                az deployment group cancel \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$dep_name"

                for i in $(seq 1 30); do
                  state=$(az deployment group show \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$dep_name" \
                    --query properties.provisioningState \
                    -o tsv 2>/dev/null || echo "NotFound")

                  if [ "$state" != "Accepted" ] && [ "$state" != "Running" ]; then
                    echo "Deployment $dep_name state after cancel: $state"
                    break
                  fi

                  echo "Waiting for deployment cancel to complete (attempt $i/30)..."
                  sleep 5
                done
              fi
            }

            # If a previous run left the RG mid-delete, wait it out before re-creating.
            for i in $(seq 1 60); do
              RG_STATE=$(az group show --name "$AZURE_RESOURCE_GROUP" --query properties.provisioningState -o tsv 2>/dev/null || echo "NotFound")
              if [ "$RG_STATE" != "Deleting" ]; then
                echo "Resource group state: $RG_STATE"
                break
              fi
              echo "Resource group is still Deleting; waiting (attempt $i/60)..."
              sleep 10
            done

            az group create --name "$AZURE_RESOURCE_GROUP" --location westeurope

            cancel_active_deployment "$REGISTRY_DEPLOYMENT_NAME"

            az deployment group create \
              --name "$REGISTRY_DEPLOYMENT_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/registry.bicep \
              --parameters environmentName="$DEPLOY_ENVIRONMENT"

            ACR_NAME=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$REGISTRY_DEPLOYMENT_NAME" --query properties.outputs.acrName.value -o tsv)
            ACR_LOGIN_SERVER=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$REGISTRY_DEPLOYMENT_NAME" --query properties.outputs.acrLoginServer.value -o tsv)
            UAMI_ID=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "$REGISTRY_DEPLOYMENT_NAME" --query properties.outputs.uamiId.value -o tsv)

            echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
            echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
            echo "uami_id=$UAMI_ID" >> "$GITHUB_OUTPUT"
            echo "ACR:  $ACR_LOGIN_SERVER"
            echo "UAMI: $UAMI_ID"

      - name: Build & push backend image to ACR
        id: image
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            IMAGE_TAG="${GITHUB_SHA::7}"
            ACR_NAME="${{ steps.registry.outputs.acr_name }}"
            ACR_LOGIN_SERVER="${{ steps.registry.outputs.acr_login_server }}"
            IMAGE_REF="$ACR_LOGIN_SERVER/backend:$IMAGE_TAG"

            az acr build \
              --registry "$ACR_NAME" \
              --image "backend:$IMAGE_TAG" \
              --file backend/Dockerfile \
              backend

            echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
            echo "Pushed: $IMAGE_REF"

      - name: Deploy infrastructure
        id: infra
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            DEP_STATE=$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --query properties.provisioningState \
              -o tsv 2>/dev/null || echo "NotFound")

            if [ "$DEP_STATE" = "Accepted" ] || [ "$DEP_STATE" = "Running" ]; then
              echo "Deployment $DEPLOYMENT_NAME is active ($DEP_STATE). Canceling to avoid DeploymentActive conflicts..."
              az deployment group cancel \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$DEPLOYMENT_NAME"

              for i in $(seq 1 30); do
                DEP_STATE=$(az deployment group show \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$DEPLOYMENT_NAME" \
                  --query properties.provisioningState \
                  -o tsv 2>/dev/null || echo "NotFound")

                if [ "$DEP_STATE" != "Accepted" ] && [ "$DEP_STATE" != "Running" ]; then
                  echo "Deployment $DEPLOYMENT_NAME state after cancel: $DEP_STATE"
                  break
                fi

                echo "Waiting for deployment cancel to complete (attempt $i/30)..."
                sleep 5
              done
            fi

            az deployment group create \
              --name "$DEPLOYMENT_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters infra/${DEPLOY_ENVIRONMENT}.bicepparam \
              --parameters \
                backendImage="${{ steps.image.outputs.image_ref }}"

            STATIC_WEB_APP_NAME=$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --query properties.outputs.staticSiteNameOut.value -o tsv)

            BACKEND_FQDN=$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --query properties.outputs.backendAppFqdn.value -o tsv)

            SWA_HOST=$(az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --query properties.outputs.staticSiteDefaultHostname.value -o tsv)

            az config set extension.use_dynamic_install=yes_without_prompt
            SWA_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.apiKey -o tsv)
            echo "::add-mask::$SWA_DEPLOYMENT_TOKEN"

            echo "static_web_app_name=$STATIC_WEB_APP_NAME" >> "$GITHUB_OUTPUT"
            echo "swa_deployment_token=$SWA_DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
            echo "Backend FQDN:  https://$BACKEND_FQDN"
            echo "Frontend host: https://$SWA_HOST"

      - name: Smoke test backend health
        run: |
          set -euo pipefail
          HEALTH_URL="https://${{ steps.infra.outputs.backend_fqdn }}/health"
          echo "Checking backend health at: $HEALTH_URL"
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/backend-health.txt \
            --write-out "%{http_code}" \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$HEALTH_URL")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "Backend health check reachable (HTTP $HTTP_CODE)."
            if [ -s /tmp/backend-health.txt ]; then
              cat /tmp/backend-health.txt
            fi
          else
            echo "Unexpected backend health status: $HTTP_CODE"
            if [ -s /tmp/backend-health.txt ]; then
              cat /tmp/backend-health.txt
            fi
            exit 1
          fi

      - name: Deploy frontend to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Route browser API calls through SWA so auth context can be forwarded
          # to the linked backend and CORS issues are avoided.
          PUBLIC_API_BASE_URL: /api
        with:
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.swa_deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: build
          app_build_command: npm install && npm run build && cp staticwebapp.config.json build/staticwebapp.config.json

      - name: Set up Python for smoke test
        if: env.DEPLOY_ENVIRONMENT == 'dev'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install smoke test dependencies
        if: env.DEPLOY_ENVIRONMENT == 'dev'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pymongo

      - name: Run post-deploy smoke test
        if: env.DEPLOY_ENVIRONMENT == 'dev'
        env:
          SKIP_WORKFLOW_STATUS: '1'
        run: bash scripts/check-deploy.sh "$DEPLOY_ENVIRONMENT"
